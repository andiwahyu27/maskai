{% extends "base.html" %}
{% block content %}
<div x-data="{logs:'Loading...',level:'all'}"
     x-init="async function load(){let r=await fetch('/api/logs?level='+level);logs=(await r.json()).logs;setTimeout(load,10000)};load()">
  <div class="flex justify-between mb-4">
    <h2 class="text-2xl font-bold">📜 Log</h2>
    <select x-model="level" class="bg-gray-700 border border-gray-600 rounded p-2"
            @change="async()=>{let r=await fetch('/api/logs?level='+level);logs=(await r.json()).logs}">
      <option value="all">Semua</option>
      <option value="ERROR">Error</option>
      <option value="WARNING">Warning</option>
      <option value="INFO">Info</option>
    </select>
  </div>
  <pre class="bg-gray-950 text-green-400 p-4 rounded text-xs overflow-x-auto max-h-[70vh] overflow-y-auto" x-text="logs"></pre>
</div>
{% endblock %}
