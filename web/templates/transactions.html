{% extends "base.html" %}
{% block content %}
<div x-data="txPage()" x-init="load()">
  <div class="flex justify-between items-center mb4">
    <h2>💰 Transaksi</h2>
    <span class="text-gray text-sm" x-text="filtered.length+' total'"></span>
  </div>
  <div class="flex gap2 mb4">
    <select x-model="filter" class="input" style="width:auto">
      <option value="all">Semua</option>
      <option value="I">📥 Pemasukan</option>
      <option value="E">📤 Pengeluaran</option>
    </select>
    <input type="text" x-model="search" placeholder="Cari..." class="input" style="flex:1">
  </div>
  <div class="card" style="overflow-x:auto">
    <table class="table w-full">
      <thead><tr><th>Tgl</th><th class="text-right">Jumlah</th><th>Kat</th><th>Deskripsi</th></tr></thead>
      <tbody>
        <template x-for="t in filtered" :key="t.id">
          <tr>
            <td x-text="(t.transaction_dt||'').slice(0,10)"></td>
            <td :class="'text-right '+(t.type=='I'?'text-green':'text-red')" x-text="'Rp '+(t.amount||0).toLocaleString('id-ID')"></td>
            <td x-text="t.category_name"></td>
            <td class="text-gray" x-text="t.description||'-'"></td>
          </tr>
        </template>
      </tbody>
    </table>
  </div>
</div>
<script>
function txPage(){return{
  txs:[],filter:'all',search:'',
  get filtered(){return this.txs.filter(t=>(this.filter=='all'||t.type==this.filter)&&(!this.search||JSON.stringify(t).toLowerCase().includes(this.search.toLowerCase())))},
  async load(){let r=await fetch('/api/transactions');this.txs=await r.json()}
}}</script>
{% endblock %}
