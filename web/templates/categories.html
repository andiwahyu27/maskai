{% extends "base.html" %}
{% block content %}
<div x-data="{cats:[],showAdd:false,editId:null,form:{name:'',type:'E',icon:'📦'}}"
     x-init="let r=await fetch('/api/categories');cats=await r.json()">
  <div class="flex justify-between mb-4">
    <h2 class="text-2xl font-bold">📋 Kategori</h2>
    <button @click="showAdd=!showAdd;editId=null;form={name:'',type:'E',icon:'📦'}" class="bg-green-600 px-4 py-2 rounded">+ Tambah</button>
  </div>

  <div x-show="showAdd||editId" class="bg-gray-800 rounded p-4 mb-4">
    <select x-model="form.type" class="bg-gray-700 border border-gray-600 rounded p-2 mb-2 w-full">
      <option value="E">💳 Pengeluaran</option>
      <option value="I">💰 Pemasukan</option>
    </select>
    <input x-model="form.name" placeholder="Nama" class="bg-gray-700 border border-gray-600 rounded p-2 mb-2 w-full">
    <input x-model="form.icon" placeholder="Icon" class="bg-gray-700 border border-gray-600 rounded p-2 mb-2 w-full">
    <button @click="async()=>{
      let m=editId?'PUT':'POST';
      let r=await fetch('/api/categories',{method:m,headers:{'Content-Type':'application/json'},body:JSON.stringify({...form,id:editId})});
      let d=await r.json();
      if(d.ok){let rr=await fetch('/api/categories');cats=await rr.json();showAdd=false;editId=null}
    }" class="bg-blue-600 px-4 py-2 rounded" x-text="editId?'Update':'Simpan'"></button>
    <button @click="showAdd=false;editId=null" class="bg-gray-600 px-4 py-2 rounded ml-2">Batal</button>
  </div>

  <div class="bg-gray-800 rounded">
    <template x-for="c in cats">
      <div class="flex justify-between items-center p-3 border-b border-gray-700">
        <span><span x-text="c.icon"></span> <span x-text="c.name"></span> <span class="text-xs text-gray-500" x-text="c.type=='I'?'💰':'💳'"></span></span>
        <span>
          <button @click="editId=c.id;form={name:c.name,type:c.type,icon:c.icon};showAdd=false" class="text-blue-400 mr-2">✏️</button>
          <button @click="await fetch('/api/categories?id='+c.id,{method:'DELETE'});let rr=await fetch('/api/categories');cats=await rr.json()" class="text-red-400">🗑</button>
        </span>
      </div>
    </template>
  </div>
</div>
{% endblock %}
