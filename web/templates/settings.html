{% extends "base.html" %}
{% block content %}
<div x-data="settingsPage()" x-init="load()">
  <h2>⚙️ Pengaturan</h2>
  <div x-show="msg" class="card mb4" style="background:#166534;text-align:center" x-text="msg"></div>
  <div class="card space-y">
    <div>
      <label class="text-sm text-gray">Model Teks</label>
      <select x-model="data.text_model" class="input">
        <option>dahono/claude-sonnet-4.5-free</option>
        <option>dahono/deepseek-v4-flash</option>
        <option>dahono/gpt-5.5</option>
      </select>
    </div>
    <div>
      <label class="text-sm text-gray">Model OCR</label>
      <select x-model="data.ocr_model" class="input">
        <option>dahono/gpt-5.5</option>
        <option>dahono/gpt-5.6-luna</option>
      </select>
    </div>
    <div>
      <label class="text-sm text-gray">Bot Token</label>
      <input x-model="data.bot_token" class="input" readonly>
    </div>
    <div>
      <label class="text-sm text-gray">Admin Chat ID</label>
      <input x-model="data.admin_id" class="input">
    </div>
    <div>
      <label class="text-sm text-gray">Google Sheets ID</label>
      <input x-model="data.sheet_id" class="input">
    </div>
    <button @click="save()" class="btn btn-blue">💾 Save</button>
  </div>
</div>
<script>
function settingsPage(){return{
  data:{},msg:'',
  async load(){let r=await fetch('/api/settings');this.data=await r.json()},
  async save(){await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(this.data)});this.msg='✅ Saved!';setTimeout(()=>this.msg='',3000)}
}}</script>
{% endblock %}
