<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MASKAI Dashboard</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#111827;color:#e5e7eb;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
        nav{background:#1f2937;border-bottom:1px solid #374151;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}
        nav .brand{font-size:1.2rem;font-weight:700;display:flex;align-items:center;gap:8px}
        nav .brand svg{width:28px;height:28px}
        nav .links{display:flex;gap:4px;align-items:center}
        nav .links a,nav .links button{padding:8px 12px;border-radius:8px;text-decoration:none;color:#9ca3af;font-size:.9rem;border:none;background:none;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s}
        nav .links a:hover,nav .links button:hover,.nav-active{background:#374151;color:#fff}
        nav .links a svg,nav .links button svg{width:18px;height:18px;opacity:.7}
        .dropdown{position:relative}
        .dropdown-menu{display:none;position:absolute;right:0;top:100%;margin-top:8px;background:#1f2937;border:1px solid #374151;border-radius:8px;min-width:150px;z-index:50;box-shadow:0 10px 25px rgba(0,0,0,.5)}
        .dropdown-menu.show{display:block}
        .dropdown-menu a{display:block;padding:10px 16px;color:#e5e7eb;text-decoration:none;font-size:.9rem;border-radius:0}
        .dropdown-menu a:hover{background:#374151}
        .dropdown-menu a:first-child{border-radius:8px 8px 0 0}
        .dropdown-menu a:last-child{border-radius:0 0 8px 8px}
        .dropdown-menu a.text-red{color:#f87171}
        main{padding:16px;max-width:900px;margin:0 auto}
        h2{font-size:1.5rem;font-weight:700;margin-bottom:16px}
        .card{background:#1f2937;border-radius:8px;padding:16px}
        .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
        .stat{background:#1f2937;border-radius:8px;padding:16px;text-align:center}
        .stat .val{font-size:1.25rem;font-weight:700}
        .stat .lbl{font-size:.75rem;color:#9ca3af;margin-top:4px}
        .btn{display:block;width:100%;padding:12px;border-radius:8px;border:none;color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;transition:opacity .2s}
        .btn:hover{opacity:.85}
        .btn-blue{background:#2563eb}
        .btn-yellow{background:#ca8a04}
        .btn-green{background:#16a34a}
        .btn-red{background:#dc2626}
        .btn-gray{background:#4b5563}
        .table{width:100%;font-size:.875rem;border-collapse:collapse}
        .table th{background:#374151;padding:8px;text-align:left}
        .table td{padding:8px;border-bottom:1px solid #374151}
        .table tr:hover td{background:#1f2937}
        .input{width:100%;padding:10px;background:#374151;border:1px solid #4b5563;border-radius:6px;color:#fff;margin-bottom:8px}
        .input:focus{outline:none;border-color:#6366f1}
        .badge{padding:2px 8px;border-radius:12px;font-size:.75rem}
        .badge-green{background:#166534;color:#4ade80}
        .badge-red{background:#7f1d1d;color:#f87171}
        .gap2{gap:8px}.mb4{margin-bottom:16px}.flex{display:flex}.justify-between{justify-content:space-between}.items-center{align-items:center}.text-sm{font-size:.875rem}.text-xs{font-size:.75rem}.text-gray{color:#9ca3af}.text-green{color:#4ade80}.text-red{color:#f87171}.text-right{text-align:right}.text-center{text-align:center}.w-full{width:100%}.p2{padding:8px}.p3{padding:12px}.p4{padding:16px}.rounded{border-radius:8px}.space-y>*+*{margin-top:8px}
        .spinner{display:inline-block;width:40px;height:40px;border:4px solid #374151;border-top-color:#6366f1;border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        @media(max-width:640px){.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
    </style>
</head>
<body x-data="{ accountOpen: false }" @click.outside="accountOpen = false">
    <nav>
        <span class="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg>
            MASKAI
        </span>
        <div class="links">
            <a href="/" class="{% if request.path == '/' %}nav-active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span class="hide-mobile">Home</span>
            </a>
            <a href="/transactions" class="{% if request.path == '/transactions' %}nav-active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></svg>
                <span class="hide-mobile">Transaksi</span>
            </a>
            <a href="/categories" class="{% if request.path == '/categories' %}nav-active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span class="hide-mobile">Kategori</span>
            </a>
            <a href="/settings" class="{% if request.path == '/settings' %}nav-active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                <span class="hide-mobile">Settings</span>
            </a>
            <a href="/logs" class="{% if request.path == '/logs' %}nav-active{% endif %}">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 17"/><line x1="12" y1="12" x2="20" y2="12"/></svg>
                <span class="hide-mobile">Logs</span>
            </a>

            <!-- Account dropdown -->
            <div class="dropdown">
                <button @click="accountOpen = !accountOpen" :class="accountOpen ? 'nav-active' : ''">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </button>
                <div class="dropdown-menu" :class="{ show: accountOpen }" @click="accountOpen = false">
                    <a href="/logout" class="text-red">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:8px;vertical-align:middle"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <style>
        .hide-mobile{display:inline}
        @media(max-width:640px){.hide-mobile{display:none}}
    </style>
</body>
</html>
