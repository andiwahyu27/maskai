{% extends "base.html" %}
{% block content %}
<div x-data="dashboard()" x-init="init()">
  <h2>📊 Dashboard</h2>

  <!-- Loading -->
  <div x-show="loading" class="card text-center mb4" style="padding:32px">
    <div class="spinner" style="margin:0 auto 12px"></div>
    <p class="text-gray">⏳ Memuat data dashboard...</p>
  </div>

  <!-- Stats -->
  <div x-show="!loading" class="grid4 mb4">
    <div class="stat" :style="'border:2px solid '+(data.bot_running?'#16a34a':'#dc2626')">
      <div class="val" style="font-size:1.5rem" x-text="data.bot_running ? '🟢' : '🔴'"></div>
      <div class="lbl">Bot</div>
    </div>
    <div class="stat">
      <div class="val" x-text="'Rp '+(data.balance||0).toLocaleString('id-ID')"></div>
      <div class="lbl">Saldo</div>
    </div>
    <div class="stat">
      <div class="val text-green" x-text="'Rp '+(data.income||0).toLocaleString('id-ID')"></div>
      <div class="lbl">📥 Pemasukan</div>
    </div>
    <div class="stat">
      <div class="val text-red" x-text="'Rp '+(data.expense||0).toLocaleString('id-ID')"></div>
      <div class="lbl">📤 Pengeluaran</div>
    </div>
  </div>

  <!-- Actions -->
  <div x-show="!loading" class="grid2 mb4">
    <button @click="sync()" class="btn btn-blue">📊 Sync Sheets</button>
    <button @click="restart()" class="btn btn-yellow">🔄 Restart Bot</button>
  </div>

  <!-- Recent -->
  <div x-show="!loading" class="card">
    <h3 style="font-size:1rem;margin-bottom:8px">📋 Transaksi Terbaru</h3>
    <template x-for="t in data.recent || []" :key="t.id">
      <div class="flex justify-between p2" style="border-bottom:1px solid #374151">
        <span x-text="(t.type=='I'?'📥':'📤')+' Rp '+(t.amount||0).toLocaleString('id-ID')"></span>
        <span class="text-gray text-sm" x-text="(t.transaction_dt||'').slice(0,10)"></span>
      </div>
    </template>
    <div x-show="data.recent && data.recent.length==0" class="text-gray text-center p4">
      Belum ada transaksi
    </div>
  </div>
</div>

<script>
function dashboard(){return{
  data:{bot_running:false,balance:0,income:0,expense:0,recent:[]},
  loading:true,
  async init(){await this.loadData()},
  async loadData(){
    try{let r=await fetch('/api/status');if(!r.ok)throw new Error('API error');this.data=await r.json()}
    catch(e){console.error(e)}this.loading=false
  },
  async sync(){
    try{let r=await fetch('/api/sync');let d=await r.json();alert(d.ok?('✅ '+d.count+' transaksi disinkron!'):('❌ Error: '+d.error))}
    catch(e){alert('❌ Gagal sync: '+e)}
  },
  async restart(){
    if(!confirm('Yakin restart bot?'))return
    try{await fetch('/api/restart');alert('✅ Bot direstart!');this.loading=true;setTimeout(async()=>await this.loadData(),3000)}
    catch(e){alert('❌ Gagal: '+e)}
  }
}}</script>
{% endblock %}
